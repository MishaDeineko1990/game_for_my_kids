<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"></head><body style="margin:0;height:100vh"><title>Трактор-Складайка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one full-screen canvas "sketchbook page" with a paper-card overlay for menus. Single light theme on purpose (paper). */
:root{
  --paper:#faf4e4; --ink:#3a2e25; --sky:#bfe3f5; --grass:#8cc56a;
  --red:#d73c32; --sun:#ffd746;
  --hand:"Caveat","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%}
[hidden]{display:none!important}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;pointer-events:none;font-family:var(--hand);font-size:26px;font-weight:700}
.hud button{pointer-events:auto}
.iconbtn{font-family:var(--hand);font-size:22px;font-weight:700;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px 10px 16px 9px;padding:2px 12px;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(58,46,37,.25)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px 14px 26px 12px;box-shadow:6px 7px 0 var(--ink);padding:22px 22px 26px;max-width:380px;width:100%;text-align:center;font-family:var(--hand)}
.card h1{font-size:46px;line-height:1;margin:0 0 6px;text-wrap:balance}
.card p{font-size:24px;margin:6px 0 14px;line-height:1.15}
.card img{width:170px;max-width:100%;margin:0 auto 6px;display:block}
.big{font-family:var(--hand);font-size:34px;font-weight:700;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:18px 12px 20px 10px;padding:6px 34px;cursor:pointer;box-shadow:3px 4px 0 var(--ink)}
.big:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.big:focus-visible,.iconbtn:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
.stars{font-size:40px;letter-spacing:4px;color:#e6a91a}
.lvls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 16px}
.lvls button{font-family:var(--hand);font-size:24px;font-weight:700;width:48px;height:48px;border:2.5px solid var(--ink);border-radius:12px 9px 14px 8px;background:#fff;color:var(--ink);cursor:pointer}
.lvls button.on{background:var(--sun)}
.lvls button:disabled{opacity:.35;cursor:default}
</style>

<div id="wrap">
  <canvas id="c" aria-label="Гра: трактор їде полем, склади блоки на причіп"></canvas>
  <div class="hud">
    <span id="hudL">Рівень 1</span>
    <span id="hudM"></span>
    <button class="iconbtn" id="snd" aria-label="Звук">🔊</button>
  </div>
  <div class="overlay" id="ov">
    <div class="card" id="card"></div>
  </div>
</div>

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);SW=cv.clientWidth;SH=cv.clientHeight;cv.width=SW*DPR;cv.height=SH*DPR;SC=SW/WW;WH=SH/SC}

function spr(n,x,y,w,h,flip){const f=F[n];if(!f)return;w=w??f.w;h=h??f.h;
  if(flip){cx.save();cx.translate(x+w,y);cx.scale(-1,1);cx.drawImage(img,f.x,f.y,f.w,f.h,0,0,w,h);cx.restore()}
  else cx.drawImage(img,f.x,f.y,f.w,f.h,x,y,w,h)}
function sprRot(n,cxp,cyp,s,a){const f=F[n];cx.save();cx.translate(cxp,cyp);cx.rotate(a);cx.drawImage(img,f.x,f.y,f.w,f.h,-f.w*s/2,-f.h*s/2,f.w*s,f.h*s);cx.restore()}

/* ---------- sound ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('ts_mute')==='1'}catch(e){}
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='sine',v=.18,slide=0,delay=0){if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const S={drop(){tone(520,.15,'triangle',.12,-200)},land(){tone(140,.12,'square',.08,-60);tone(660,.12,'sine',.15,0,.05);tone(990,.15,'sine',.12,0,.11)},
miss(){tone(400,.5,'sawtooth',.08,-280)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.15,0,i*.12))},beep(){tone(1250,.08,'square',.04)}};
document.getElementById('snd').onclick=e=>{e.stopPropagation();muted=!muted;e.target.textContent=muted?'🔇':'🔊';try{localStorage.setItem('ts_mute',muted?'1':'0')}catch(_){}};
if(muted)document.getElementById('snd').textContent='🔇';

/* ---------- game state ---------- */
const K=.62, BW=128*K, BH=74*K;            // rig scale, block visual size
let unlocked=1; try{unlocked=Math.max(1,+localStorage.getItem('ts_unlocked')||1)}catch(e){}
let G=null;
function newGame(li){
  const L=LEVELS[li];
  G={li,L,rigX:WW*0.62,dir:-1,speed:L.speed,stack:[],falling:null,lost:[],hanging:pick(L),hearts:3,
     cam:0,sway:0,swayV:0,wheelA:0,state:'play',t:0,hookX:WW/2,parts:[],leave:0,beepT:0,hangT:0};
  setHud();hideOv();
}
function pick(L){return L.blocks[Math.floor(Math.random()*L.blocks.length)]}
function ground(){return WH-70}
function geo(){ // rig geometry in world coords
  const gy=ground(), trL=G.rigX-100*K, trTop=gy-76*K, tractL=trL-215*K, tractTop=gy-172*K;
  return {gy,trL,trTop,deckY:trTop+8*K,tractL,tractTop};
}
function setHud(){document.getElementById('hudL').textContent='Рівень '+(G.li+1);
  document.getElementById('hudM').textContent='♥'.repeat(G.hearts)+'♡'.repeat(3-G.hearts)+'   '+G.stack.length+' / '+G.L.goal}

function tap(){
  au();
  if(!G||G.state!=='play'||G.falling)return;
  const hy=hookY();
  G.falling={type:G.hanging,x:G.hookX,y:hy+62,vy:40,rot:0,vr:0};
  G.hanging=null;G.hangT=0;S.drop();
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(document.getElementById('ov').hidden){e.preventDefault();tap()}}});

function topY(){return geo().deckY-G.stack.length*BH}
function hookY(){return topY()-200}

function update(dt){
  G.t+=dt;
  const g=geo();
  // tractor movement
  if(G.state==='play'){
    const minX=WW*0.46,maxX=WW*0.86;
    let old=G.dir;
    G.rigX+=G.dir*G.speed*dt;
    if(G.rigX<minX){G.rigX=minX;G.dir=1}
    if(G.rigX>maxX){G.rigX=maxX;G.dir=-1}
    if(old!==G.dir){G.swayV+=-old*G.speed*.035}
    if(G.dir===1){G.beepT-=dt;if(G.beepT<=0){S.beep();G.beepT=.55}}
    G.wheelA+=-G.dir*G.speed*dt/(44*K);
    // hook swing from level 3
    G.hookX=WW/2+(G.li>=2?Math.sin(G.t*1.3)*(12+G.li*6):0);
  }else if(G.state==='leave'){
    G.rigX-=160*dt;G.wheelA+=160*dt/(44*K);G.leave+=dt;
    if(G.leave>2.4&&!G.shown){G.shown=true;winCard()}
  }
  // sway spring
  G.swayV+=(-G.sway*14-G.swayV*3.2)*dt;G.sway+=G.swayV*dt;
  // falling block
  const f=G.falling;
  if(f){
    f.vy+=1500*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;
    const ty=topY();
    if(!f.miss&&f.y+BH>=ty){
      const top=G.stack[G.stack.length-1];
      const topX=top?G.rigX+top.off:G.rigX, topW=top?BW:150*K*1.25;
      const dx=f.x-topX, lim=(topW/2+BW/2)*G.L.forgive;
      if(Math.abs(dx)<=lim){
        let off=(f.x-G.rigX); const target=top?top.off:0; off+= (target-off)*0.35;
        G.stack.push({type:f.type,off});G.falling=null;S.land();G.swayV+=dx*.02;
        burst(f.x,ty,'star',4);setHud();
        if(G.stack.length>=G.L.goal){G.state='leave';G.shown=false;S.win();burst(G.rigX,ty-40,'star',14);
          if(G.li+2>unlocked){unlocked=Math.min(LEVELS.length,G.li+2);try{localStorage.setItem('ts_unlocked',unlocked)}catch(e){}}}
        else G.hanging=pick(G.L);
      }else{f.miss=true;f.vr=(dx>0?1:-1)*4;f.vx=(dx>0?1:-1)*90;S.miss();}
    }
    if(f.miss){f.x+=f.vx*dt;
      if(f.y+BH>=g.gy+20){G.lost.push({...f,y:g.gy+20-BH,life:1.6});G.falling=null;G.hearts--;setHud();
        if(G.hearts<=0){G.state='over';setTimeout(loseCard,700)}else G.hanging=pick(G.L)}}
  }
  G.lost.forEach(l=>l.life-=dt);G.lost=G.lost.filter(l=>l.life>0);
  if(!G.hanging&&!G.falling&&G.state==='play')G.hanging=pick(G.L);
  G.hangT+=dt;
  // particles
  G.parts.forEach(p=>{p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=dt});G.parts=G.parts.filter(p=>p.life>0);
  // camera
  const want=Math.min(0,hookY()-90);G.cam+=(want-G.cam)*Math.min(1,dt*4);
}
function burst(x,y,n,k){for(let i=0;i<k;i++)G.parts.push({x,y,vx:(Math.random()-.5)*380,vy:-Math.random()*380-120,r:0,vr:(Math.random()-.5)*8,life:1+Math.random()*.6,n})}

/* ---------- drawing ---------- */
const clouds=[{x:60,y:90,s:.7,v:8},{x:300,y:150,s:.55,v:5},{x:420,y:60,s:.8,v:11}];
function draw(dt){
  cx.setTransform(DPR,0,0,DPR,0,0);
  // sky (screen space)
  const gr=cx.createLinearGradient(0,0,0,SH);gr.addColorStop(0,'#9fd3ef');gr.addColorStop(1,'#e6f5fb');
  cx.fillStyle=gr;cx.fillRect(0,0,SW,SH);
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  cx.translate(0,-G.cam*0.3);
  spr('sun',WW-120,40,90,90);
  clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>WW+40)c.x=-140;spr('cloud',c.x,c.y,160*c.s,90*c.s)});
  cx.setTransform(DPR*SC,0,0,DPR*SC,0,-G.cam*DPR*SC);
  const g=geo();
  // hills + field
  cx.fillStyle='#a8d487';cx.beginPath();cx.moveTo(0,g.gy-60);
  for(let x=0;x<=WW;x+=20)cx.lineTo(x,g.gy-60-Math.sin(x/70)*18-Math.sin(x/33)*6);cx.lineTo(WW,g.gy);cx.lineTo(0,g.gy);cx.fill();
  spr('barn',8,g.gy-150,130,117);
  spr('tree',WW-80,g.gy-150,70,102);
  cx.fillStyle='#b98a55';cx.fillRect(0,g.gy,WW,WH-g.gy+400);
  cx.strokeStyle='rgba(58,46,37,.35)';cx.lineWidth=2;
  for(let i=0;i<5;i++){const y=g.gy+10+i*14;cx.beginPath();cx.moveTo(0,y);for(let x=0;x<=WW;x+=24)cx.lineTo(x,y+Math.sin(x*.3+i)*1.5);cx.stroke()}
  cx.fillStyle='#6fae4f';for(let x=6;x<WW;x+=22){cx.beginPath();cx.moveTo(x,g.gy+2);cx.lineTo(x+5,g.gy-9);cx.lineTo(x+10,g.gy+2);cx.fill()}
  cx.strokeStyle='#3a2e25';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(0,g.gy);cx.lineTo(WW,g.gy);cx.stroke();
  // lost blocks lying on the ground
  G.lost.forEach(l=>{cx.globalAlpha=Math.min(1,l.life);sprRot(l.type,l.x,l.y+BH/2,K,l.rot);cx.globalAlpha=1});
  // rig
  const bounce=Math.sin(G.t*18)*.8;
  spr('trailer',g.trL,g.trTop+bounce,200*K,60*K);
  sprRot('wheel_small',g.trL+100*K,g.trTop+50*K,K,G.wheelA*1.7);
  spr('tractor',g.tractL,g.tractTop+bounce,240*K,170*K);
  sprRot('wheel_big',g.tractL+168*K,g.tractTop+128*K,K,G.wheelA);
  sprRot('wheel_small',g.tractL+50*K,g.tractTop+138*K,K,G.wheelA*1.7);
  // exhaust puffs
  if(G.state!=='over'&&Math.random()<.25)G.parts.push({x:g.tractL+65*K,y:g.tractTop+45*K,vx:G.dir*-10,vy:-160,r:0,vr:0,life:.7,n:'puff'});
  // stack
  G.stack.forEach((b,i)=>{const h=(i+1)/Math.max(4,G.stack.length);const sx=G.sway*h*h*6;
    spr(b.type,G.rigX+b.off-BW/2+sx-5*K,g.deckY-(i+1)*BH-5*K+bounce,128*K,84*K)});
  // crane rope + hook + hanging block
  const hy=hookY();
  cx.strokeStyle='#3a2e25';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(G.hookX,hy-600);cx.lineTo(G.hookX,hy);cx.stroke();
  spr('hook',G.hookX-30,hy-10,60,110);
  if(G.hanging){const bob=Math.sin(G.hangT*3)*2;const pop=Math.min(1,G.hangT*4);
    cx.save();cx.translate(G.hookX,hy+90);cx.scale(pop,pop);spr(G.hanging,-64*K,-6*K+bob,128*K,84*K);cx.restore();
    // ghost guide line
    cx.setLineDash([6,8]);cx.strokeStyle='rgba(58,46,37,.25)';cx.beginPath();cx.moveTo(G.hookX,hy+90+BH);cx.lineTo(G.hookX,topY());cx.stroke();cx.setLineDash([]);}
  if(G.falling){const f=G.falling;sprRot(f.type,f.x,f.y+BH/2,K,f.rot)}
  // particles
  G.parts.forEach(p=>{if(p.n==='puff'){cx.globalAlpha=p.life*.6;cx.fillStyle='#fff';cx.strokeStyle='rgba(58,46,37,.4)';cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,6+(0.7-p.life)*14,0,7);cx.fill();cx.stroke();cx.globalAlpha=1;p.vy=-40}
    else{cx.globalAlpha=Math.min(1,p.life);sprRot('star',p.x,p.y,.45,p.r);cx.globalAlpha=1}});
  // goal flag: dashed line at goal height
  if(G.state==='play'){const gy2=g.deckY-G.L.goal*BH;cx.setLineDash([10,8]);cx.strokeStyle='#d73c32';cx.lineWidth=2;cx.beginPath();cx.moveTo(G.rigX-70,gy2);cx.lineTo(G.rigX+70,gy2);cx.stroke();cx.setLineDash([]);
    spr('star',G.rigX+68,gy2-16,30,30)}
}

let last=0;
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;if(G){if(document.getElementById('ov').hidden||G.state==='leave')update(dt);draw(dt)}requestAnimationFrame(loop)}

function hideOv(){ov.hidden=true}
function showOv(html){card.innerHTML=html;ov.hidden=false;const b=card.querySelector('.big');b&&b.focus()}
function thumb(n){const f=F[n],c=document.createElement('canvas');c.width=f.w;c.height=f.h;c.getContext('2d').drawImage(img,f.x,f.y,f.w,f.h,0,0,f.w,f.h);return c.toDataURL()}
function lvlButtons(cur){return '<div class="lvls">'+LEVELS.map((L,i)=>`<button data-l="${i}" class="${i===cur?'on':''}" ${i+1>unlocked?'disabled':''} aria-label="Рівень ${i+1}">${i+1}</button>`).join('')+'</div>'}
function wireLv(){card.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{au();newGame(+b.dataset.l)})}
function startCard(){
  G=G||{li:0,L:LEVELS[0],rigX:WW*.62,dir:-1,speed:0,stack:[],lost:[],parts:[],hearts:3,cam:0,sway:0,swayV:0,wheelA:0,state:'menu',t:0,hookX:WW/2,hanging:'hay',hangT:1};
  showOv(`<img src="${thumb('tractor')}" alt=""><h1>Трактор-Складайка</h1>
  <p>Трактор їде полем.<br>Торкнись екрана — і вантаж впаде на причіп!<br>Склади башту до зірочки ⭐</p>
  ${lvlButtons(Math.min(unlocked-1,LEVELS.length-1))}
  <button class="big" id="go">Грати!</button>`);
  wireLv();document.getElementById('go').onclick=()=>{au();newGame(Math.min(unlocked-1,LEVELS.length-1))};
}
function winCard(){
  const last=G.li===LEVELS.length-1;const st=G.hearts;
  showOv(`<h1>Молодець!</h1><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <p>${G.L.title} — готово!<br>Трактор повіз вантаж на ферму.</p>
  ${last?'<p>Ти справжній Супер-фермер! 🏆</p>':''}
  <button class="big" id="go">${last?'Ще раз':'Далі'}</button>`);
  document.getElementById('go').onclick=()=>{au();newGame(last?0:G.li+1)};
}
function loseCard(){
  showOv(`<h1>Ой-ой!</h1><p>Вантаж попадав у поле.<br>Спробуємо ще раз?</p>
  <button class="big" id="go">Ще раз</button><div style="margin-top:14px"><button class="iconbtn" id="menu">Меню</button></div>`);
  document.getElementById('go').onclick=()=>{au();newGame(G.li)};
  document.getElementById('menu').onclick=()=>startCard();
}

img.onload=()=>{resize();startCard();requestAnimationFrame(loop)};
if(document.fonts)document.fonts.load('700 30px Caveat').catch(()=>{});
</script>
</body></html>
